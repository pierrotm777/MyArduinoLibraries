sentence=Lightweight virtual UART ring buffer implementing Stream.
paragraph=VirtualUart is a lightweight circular buffer implementing the Arduino Stream interface. It allows injecting bytes from alternative transports (ESP-NOW, UART bridge, radio link) and using them as a standard serial stream.
